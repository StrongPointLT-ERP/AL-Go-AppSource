name: Notify Team on Test Failure

on:
  workflow_run:
    workflows: [' Test Current', ' Test Next Major', ' Test Next Minor']
    types: [completed]

permissions:
  issues: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report failure or close on recovery
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const label = `ci-failure:${run.name.trim().toLowerCase().replace(/\s+/g, '-')}`;
            const team = '@StrongPointLT-ERP/bc-saas';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (run.conclusion === 'success') {
              if (existing.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing[0].number,
                  body: `✅ **${run.name.trim()}** passed again on \`${run.head_branch}\` (${run.html_url}) — closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing[0].number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `${team} — **${run.name.trim()}** failed.`,
              '',
              `- Run: ${run.html_url}`,
              `- Branch: \`${run.head_branch}\``,
              `- Commit: ${run.head_sha}`,
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 ${run.name.trim()} is failing`,
                body,
                labels: [label, 'ci-failure'],
              });
            }
